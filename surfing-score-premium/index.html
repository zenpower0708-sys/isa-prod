<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISA Surfing Score Premium</title>
    <script>
    // ISA 회원 전용 가드: 메인 사이트(같은 도메인)의 로그인 세션이 없으면 진입 차단
    (function(){
        var KEY = 'isa_session_v1';
        function valid(raw){
            if(!raw) return false;
            try{
                var u = JSON.parse(raw);
                if(u.expiresAt && Date.now() > u.expiresAt) return false;
                return !!(u.email || u.name);
            }catch(e){ return false; }
        }
        if(!valid(localStorage.getItem(KEY)) && !valid(sessionStorage.getItem(KEY))){
            alert('스코어엘리트 프리미엄은 ISA 회원 전용 서비스입니다.\n로그인(무료 회원가입) 후 이용해 주세요.');
            location.replace('/?login=1');
        }
    })();
    </script>
    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
