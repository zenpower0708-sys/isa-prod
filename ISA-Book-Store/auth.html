<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISA BOOK STORE | 회원가입 & 실명인증</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }

      .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-glass);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: fadeIn 0.8s ease-out;
      }

      .auth-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .auth-header h2 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .auth-header p {
        color: var(--text-dim);
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 8px;
        margin-left: 4px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border-glass);
        border-radius: 10px;
        color: white;
        font-size: 15px;
        outline: none;
        transition: var(--transition);
      }

      .form-group input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 10px var(--cyan-glow);
      }

      .verify-box {
        background: rgba(6, 182, 212, 0.05);
        border: 1px dashed var(--cyan);
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        margin-bottom: 12px;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .verify-box:hover {
        background: rgba(6, 182, 212, 0.1);
      }

      .verify-box .icon {
        font-size: 20px;
      }

      .verify-box span {
        font-size: 14px;
        font-weight: 700;
        color: var(--cyan);
      }

      .auth-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 13px;
        color: var(--text-dim);
      }

      .auth-footer a {
        color: var(--cyan);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <a href="https://isa-web-portal.vercel.app" class="btn-back-portal" style="position: fixed; top: 20px; left: 20px; color: var(--cyan); text-decoration: none; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-radius: 20px; border: 1px solid rgba(6, 182, 212, 0.3); transition: var(--transition); z-index: 1000;">
      <span>←</span> 협회 홈페이지로 돌아가기
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <h2>ISA BOOK STORE</h2>
        <p>환영합니다! 안전한 이용을 위해 실명인증이 필요합니다.</p>
      </div>

      <form id="auth-form">
        <div class="form-group">
          <label>이메일 주소</label>
          <input type="email" placeholder="example@surfing.org" required>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <div class="verify-box" onclick="alert('Pass 본인인증 모듈이 실행됩니다.')">
          <span class="icon">📱</span>
          <span>PASS로 본인인증</span>
        </div>

        <div class="verify-box" style="border-style: solid; background: rgba(255,255,255,0.05); margin-bottom: 24px;" onclick="alert('문자(SMS) 본인인증 모듈이 실행됩니다.')">
          <span class="icon">✉️</span>
          <span style="color: var(--text-white)">문자(SMS)로 인증하기</span>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">가입 및 시작하기</button>

        <div style="display: flex; align-items: center; margin: 32px 0;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
          <span style="padding: 0 16px; color: var(--text-dim); font-size: 13px;">또는 소셜 계정으로 시작</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
        </div>

        <div style="display: flex; gap: 12px;">
          <button type="button" onclick="alert('구글 로그인이 실행됩니다.')" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; border: 1px solid var(--border-glass); background: white; color: #334155; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width: 18px; height: 18px;">
            구글로 로그인
          </button>
          <button type="button" onclick="alert('애플 로그인이 실행됩니다.')" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: black; color: white; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" style="width: 18px; height: 18px; filter: invert(1);">
            애플로 로그인
          </button>
        </div>
      </form>

      <div class="auth-footer">
        이미 계정이 있으신가요? <a href="#">로그인</a>
      </div>
    </div>

    <script>
      document.getElementById('auth-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('실명인증이 완료되어야 가입 절차가 마무리됩니다.');
      });
    </script>
  </body>
</html>
