<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISA BOOK VIEWER | 학습 및 모의고사</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    :root {
      --viewer-bg: #f8fafc;
      --viewer-text: #1e293b;
      --accent: #06b6d4;
      --sidebar-bg: #0f172a;
      --border: #e2e8f0;
      --watermark: rgba(0, 0, 0, 0.03);
      --correct: #22c55e;
      --incorrect: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--viewer-bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Header */
    .viewer-header {
      background: var(--sidebar-bg);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }

    .viewer-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .level-badge {
      background: rgba(6, 182, 212, 0.2);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    /* Main Area */
    .viewer-main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Selection Screen */
    .mode-select {
      text-align: center;
      margin-top: 10vh;
    }
    .mode-select h2 {
      font-size: 32px;
      color: var(--viewer-text);
      margin-bottom: 40px;
    }
    .mode-cards {
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    .mode-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 300px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .mode-card:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(6, 182, 212, 0.1);
    }
    .mode-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .mode-card h3 {
      font-size: 20px;
      margin-bottom: 12px;
      color: var(--viewer-text);
    }
    .mode-card p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }

    /* Question Container */
    .question-container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-bottom: 24px;
      display: none; /* hidden by default */
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      color: #64748b;
      font-weight: 600;
    }

    .q-text {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      padding: 16px 20px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      text-align: left;
      font-size: 16px;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #f0f9ff;
    }

    .opt-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #64748b;
    }

    /* States */
    .option-btn.selected {
      border-color: var(--accent);
      background: #f0f9ff;
    }
    .option-btn.selected .opt-num {
      background: var(--accent);
      color: white;
    }
    .option-btn.correct {
      border-color: var(--correct);
      background: #f0fdf4;
    }
    .option-btn.correct .opt-num {
      background: var(--correct);
      color: white;
    }
    .option-btn.incorrect {
      border-color: var(--incorrect);
      background: #fef2f2;
    }
    .option-btn.incorrect .opt-num {
      background: var(--incorrect);
      color: white;
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 32px;
      padding: 24px;
      background: #f8fafc;
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      display: none;
    }
    .explanation-box.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    .exp-title {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin-top: 16px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: #475569;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }

    .btn-fill {
      background: var(--accent);
      color: white;
    }
    .btn-fill:hover {
      background: #0891b2;
    }
    .btn-submit {
      background: var(--sidebar-bg);
      color: white;
    }

    /* Result Screen */
    .result-screen {
      text-align: center;
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      display: none;
    }

    .score-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 8px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      margin: 0 auto 24px;
    }
    .pass .score-circle { border-color: var(--correct); color: var(--correct); }
    .fail .score-circle { border-color: var(--incorrect); color: var(--incorrect); }

    .result-status {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .pass .result-status { color: var(--correct); }
    .fail .result-status { color: var(--incorrect); }

    /* Watermark Layer */
    .watermark-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      flex-wrap: wrap;
      opacity: 0.04;
    }
    .watermark-item {
      font-size: 14px;
      color: #000;
      transform: rotate(-30deg);
      padding: 60px;
      white-space: nowrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media print {
      body { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="watermark-container" class="watermark-overlay"></div>

  <header class="viewer-header">
    <div class="viewer-title">
      <a href="javascript:history.back()" style="color:white; text-decoration:none; margin-right: 12px; font-size: 20px;">←</a>
      <span id="header-title">ISA E-PASS 교재 로딩중...</span>
      <span id="header-level" class="level-badge"></span>
    </div>
    <div style="font-size: 13px; color: #94a3b8;">
      <span id="header-mode">모드 선택</span>
    </div>
  </header>

  <main class="viewer-main">
    <div class="content-area">
      
      <!-- 1. Mode Selection -->
      <div id="screen-select" class="mode-select">
        <h2>학습 모드를 선택하세요</h2>
        <div class="mode-cards">
          <div class="mode-card" onclick="startMode('practice')">
            <div class="mode-icon">📖</div>
            <h3>문제은행 (학습 모드)</h3>
            <p>한 문제씩 풀고 바로 정답과 해설을 확인합니다. 오답을 정리하며 공부하기에 적합합니다.</p>
          </div>
          <div class="mode-card" onclick="startMode('exam')">
            <div class="mode-icon">⏱️</div>
            <h3>실전 모의고사</h3>
            <p>실제 시험과 동일하게 급수별 문항수가 무작위로 출제되며, 마지막에 점수와 합격을 판정합니다.</p>
          </div>
        </div>
      </div>

      <!-- 2. Question View -->
      <div id="screen-question" class="question-container">
        <div class="q-header">
          <span id="q-progress">문제 1 / 30</span>
          <span id="q-mode-badge">학습 모드</span>
        </div>
        
        <div class="q-text" id="q-text">
          문제 텍스트가 여기에 표시됩니다.
        </div>

        <div class="options-list" id="q-options">
          <!-- Options will be rendered here -->
        </div>

        <div class="explanation-box" id="q-explanation">
          <div class="exp-title">💡 정답 및 해설</div>
          <div id="exp-text">해설 내용이 여기에 표시됩니다.</div>
        </div>
      </div>

      <!-- Controls -->
      <div id="screen-controls" class="controls" style="display:none;">
        <button class="btn btn-outline" id="btn-prev" onclick="prevQuestion()">이전 문제</button>
        <button class="btn btn-fill" id="btn-next" onclick="nextQuestion()">다음 문제</button>
        <button class="btn btn-submit" id="btn-submit" style="display:none;" onclick="submitExam()">정답 제출</button>
      </div>

      <!-- 3. Result Screen -->
      <div id="screen-result" class="result-screen">
        <h2>실전 모의고사 결과</h2>
        <div id="result-wrapper">
          <div class="score-circle" id="res-score">0</div>
          <div class="result-status" id="res-status">불합격</div>
          <p style="color: #64748b; margin-bottom: 32px;" id="res-detail">30문제 중 15문제 정답</p>
        </div>
        <div style="display: flex; gap: 16px; justify-content: center;">
          <button class="btn btn-outline" onclick="location.reload()">처음으로</button>
          <button class="btn btn-fill" onclick="reviewIncorrect()">오답노트 확인</button>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="/src/viewer-app.js"></script>
  <script>
    // Watermark
    const wmContainer = document.getElementById('watermark-container');
    for(let i=0; i<50; i++) {
      const item = document.createElement('div');
      item.className = 'watermark-item';
      item.innerText = 'ISA_SECURE_VIEWER';
      wmContainer.appendChild(item);
    }

    // Security
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'c' || e.key === 'u')) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
    });
  </script>
</body>
</html>
