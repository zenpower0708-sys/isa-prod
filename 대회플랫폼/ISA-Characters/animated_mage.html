<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Mage - ISA Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a78bfa;
            --secondary: #6366f1;
            --gold: #f59e0b;
            --bg: #0f172a;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            cursor: pointer;
        }

        /* Magical Background Particles */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: moveUp 5s linear infinite;
        }

        @keyframes moveUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Summoning Circle */
        .circle {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            opacity: 0.2;
            animation: rotate 20s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border: 1px solid var(--secondary);
            border-radius: 50%;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Mage Container */
        .mage-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Character Extraction & Animation */
        .mage {
            width: 280px; /* Adjust based on character size */
            height: 400px;
            background-image: url('female_characters.png');
            background-size: 300% 100%; /* Total characters are 3 */
            background-position: 5% center; /* The first character (Mage) */
            background-repeat: no-repeat;
            
            filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.4));
            animation: float 3s ease-in-out infinite, breath 5s ease-in-out infinite;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mage:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 25px rgba(167, 139, 250, 0.7));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes breath {
            0%, 100% { scale: 1; }
            50% { scale: 1.02; opacity: 0.9; }
        }

        /* Speech Bubble */
        .bubble {
            position: absolute;
            top: -60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .mage-wrap.active .bubble {
            opacity: 1;
            transform: translateY(0);
        }

        /* Instructions */
        .hint {
            position: fixed;
            bottom: 40px;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* Flash Effect */
        .flash {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes flashEffect {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="flash" id="flash"></div>

    <div class="particles" id="particles"></div>

    <div class="circle"></div>

    <div class="mage-wrap" id="mageWrap">
        <div class="bubble">"무엇이든 물어보세요! 마법처럼 해결해 드릴게요. ✨"</div>
        <div class="mage"></div>
    </div>

    <div class="hint">CLICK TO CAST A SPELL</div>

    <script>
        // Create random particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.background = `hsl(${260 + Math.random() * 40}, 80%, 80%)`;
            particlesContainer.appendChild(p);
        }

        // Interaction
        const mageWrap = document.getElementById('mageWrap');
        const flash = document.getElementById('flash');

        document.body.addEventListener('click', () => {
            // Flash effect
            flash.style.animation = 'none';
            void flash.offsetWidth; // Trigger reflow
            flash.style.animation = 'flashEffect 0.3s ease-out forwards';

            // Toggle bubble
            mageWrap.classList.add('active');
            setTimeout(() => {
                mageWrap.classList.remove('active');
            }, 3000);
        });
    </script>
</body>
</html>
